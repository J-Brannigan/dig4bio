[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dig4bio"
version = "0.1.0"
description = "Utilities and modelling code for the Dig4Bio Kaggle project."
requires-python = ">=3.12"
dependencies = [
    "scipy"
]

[project.scripts]
clean-transfer-plate = "dig4bio.cli:make_interim_transfer_plate_command"
clean-test-samples = "dig4bio.cli:make_interim_test_samples_command"
clean-8-devices = "dig4bio.cli:make_interim_8_devices_command"
clean-all-data = "dig4bio.cli:make_all_interim_command"
make-eda-figures = "dig4bio.cli:make_all_eda_figures_command"